# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # pestphp/pest-plugin-type-coverage calls AnalyserResult::getCollectedData(),
      # which PHPStan 2.3.6 removed. Remove this, and the "<2.3.6" constraint in
      # composer.json, once pestphp/pest-plugin-type-coverage#75 is released.
      - dependency-name: "phpstan/phpstan"
        versions: [">=2.3.6"]
